  html { scroll-behavior: smooth; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #B08C4F55; border-radius: 4px; }

  .thread { position: relative; display: inline-block; }
  .thread::after {
    content: ''; position: absolute; left: 0; bottom: -6px; height: 1px; width: 0;
    background: linear-gradient(90deg, #B08C4F, transparent);
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }
  [dir="rtl"] .thread::after { left: auto; right: 0; background: linear-gradient(270deg, #B08C4F, transparent); }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.show { opacity: 1; transform: translateY(0); }

  .tilt-card { transition: transform .15s ease-out, box-shadow .3s ease; will-change: transform; transform-style: preserve-3d; }

  .gold-btn {
    background: linear-gradient(180deg, #C9A566, #A17C42);
    color: #14120F;
    transition: all .35s ease;
    letter-spacing: .18em;
    font-weight: 500;
  }
  .gold-btn:hover { background: linear-gradient(180deg, #D8BD8A, #B08C4F); box-shadow: 0 8px 24px -8px rgba(176,140,79,0.6); transform: translateY(-1px); }

  .ghost-btn { border: 1px solid #B08C4F88; color: inherit; transition: all .35s ease; }
  .ghost-btn:hover { background: #B08C4F; color: #14120F; border-color: #B08C4F; }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;

  input[type=range] { -webkit-appearance: none; height: 2px; background: #D8C7A8; border-radius: 2px; }

  .drawer { transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .fade-scale { animation: fadeScale .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeScale { from { opacity:0; transform: scale(.97); } to { opacity:1; transform: scale(1); } }

  .noise-overlay {
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  }

  .marquee-track { animation: marquee 28s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  [dir="rtl"] .marquee-track { animation: marquee-rtl 28s linear infinite; }
  @keyframes marquee-rtl { from { transform: translateX(-50%); } to { transform: translateX(0); } }

  .snap-x { scroll-snap-type: x mandatory; }
  .snap-c { scroll-snap-align: center; }

  .float-slow { animation: floatY 6s ease-in-out infinite; }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

  ::selection { background: #B08C4F; color: #14120F; }

function loadLS(key, fallback) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
function saveLS(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.warn(`localStorage save error for ${key}:`, e); } }

function compressAndReadImage(file, onDone) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const rawData = e.target.result;
    if (typeof rawData === 'string' && rawData.startsWith('data:image')) {
      const img = new Image();
      img.onload = () => {
        const maxDim = 800;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const compressed = canvas.toDataURL('image/jpeg', 0.82);
          onDone(compressed);
        } catch(err) { onDone(rawData); }
      };
      img.onerror = () => onDone(rawData);
      img.src = rawData;
    } else {
      onDone(rawData);
    }
  };
  reader.readAsDataURL(file);
}

/* ---------------------------------------------------------
   WEBHOOK / EVENT ARCHITECTURE
--------------------------------------------------------- */
function useWebhookLog() {
  const [log, setLog] = useState(() => loadLS(LS_KEYS.webhooks, []));
  const emit = useCallback((eventName, payload, webhookUrl) => {
    const entry = { id: 'evt_' + Math.random().toString(36).slice(2,9), event: eventName, payload, ts: Date.now(), delivered: null };
    setLog(prev => { const next = [entry, ...prev].slice(0, 50); saveLS(LS_KEYS.webhooks, next); return next; });
    if (webhookUrl) {
      fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: eventName, payload, sentAt: new Date().toISOString() }) })
        .then(() => setLog(prev => prev.map(e => e.id === entry.id ? {...e, delivered:true} : e)))
        .catch(() => setLog(prev => prev.map(e => e.id === entry.id ? {...e, delivered:false} : e)));
    }
    return entry;
  }, []);
  return { log, emit };
}

function Reveal({ children, className='' }) {
  const ref = useRef(null);
  const [show, setShow] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) { setShow(true); obs.disconnect(); } }, { threshold: 0.15 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return <div ref={ref} className={`reveal ${show ? 'show' : ''} ${className}`}>{children}</div>;
}

/* ---------------------------------------------------------
   3D HERO OBJECT (Three.js WebGL with Mobile Fallback)
--------------------------------------------------------- */
function Hero3D({ dark }) {
  const mountRef = useRef(null);
  const [hasError, setHasError] = useState(false);

  useEffect(() => {
    if (!window.THREE || !mountRef.current) return;
    try {
      const THREE = window.THREE;
      const width = mountRef.current.clientWidth || 320;
      const height = mountRef.current.clientHeight || 320;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 100);
      camera.position.z = 6.5;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, failIfMajorPerformanceCaveat: false });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      mountRef.current.innerHTML = '';
      mountRef.current.appendChild(renderer.domElement);

      const group = new THREE.Group();
      const geo = new THREE.IcosahedronGeometry(2.1, 0);
      const wireMat = new THREE.MeshBasicMaterial({ color: 0xB08C4F, wireframe: true, transparent: true, opacity: 0.85 });
      const mesh = new THREE.Mesh(geo, wireMat);
      group.add(mesh);

      const innerGeo = new THREE.IcosahedronGeometry(1.3, 0);
      const innerMat = new THREE.MeshBasicMaterial({ color: 0xD8BD8A, wireframe: true, transparent: true, opacity: 0.5 });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);
      group.add(innerMesh);

      scene.add(group);

      let mouseX = 0, mouseY = 0;
      const onMove = (e) => {
        if (!mountRef.current) return;
        const rect = mountRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        if (clientX && clientY) {
          mouseX = ((clientX - rect.left) / rect.width - 0.5);
          mouseY = ((clientY - rect.top) / rect.height - 0.5);
        }
      };
      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });

      let raf;
      const animate = () => {
        mesh.rotation.y += 0.0032;
        mesh.rotation.x += 0.0012;
        innerMesh.rotation.y -= 0.002;
        innerMesh.rotation.x -= 0.0016;
        group.rotation.y += (mouseX*0.6 - group.rotation.y) * 0.03;
        group.rotation.x += (mouseY*0.4 - group.rotation.x) * 0.03;
        renderer.render(scene, camera);
        raf = requestAnimationFrame(animate);
      };
      animate();

      const onResize = () => {
        if (!mountRef.current) return;
        const w = mountRef.current.clientWidth, h = mountRef.current.clientHeight;
        renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
      };
      window.addEventListener('resize', onResize);

      return () => {
        cancelAnimationFrame(raf);
        window.removeEventListener('resize', onResize);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        geo.dispose(); innerGeo.dispose(); wireMat.dispose(); innerMat.dispose(); renderer.dispose();
        if (mountRef.current) mountRef.current.innerHTML = '';
      };
    } catch (e) {
      console.warn("WebGL initialization skipped on this device:", e);
      setHasError(true);
    }
  }, []);

  if (hasError) {
    return (
      <div className="w-full h-full flex items-center justify-center">
        <div className="w-44 h-44 rounded-full border border-gold/40 flex items-center justify-center animate-pulse">
          <span className="text-gold text-4xl">✦</span>
        </div>
      </div>
    );
  }

  return <div ref={mountRef} className="w-full h-full float-slow" />;
}

/* ---------------------------------------------------------
   3D TILT WRAPPER
--------------------------------------------------------- */
function TiltCard({ children, className='' }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current; if (!el) return;
    const rect = el.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    el.style.transform = `perspective(900px) rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-4px)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = 'perspective(900px) rotateY(0) rotateX(0) translateY(0)'; };
  return <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className={`tilt-card ${className}`}>{children}</div>;
}

/* ---------------------------------------------------------
   CATALOG + FILTERS
--------------------------------------------------------- */
function Catalog({ products, onOpen, dark, t, lang }) {
  const [category, setCategory] = useState('All');
  const [size, setSize] = useState('All');
  const [color, setColor] = useState('All');
  const [maxPrice, setMaxPrice] = useState(2500);
  const [sort, setSort] = useState('newest');

  const categories = ['All','Men','Women','Accessories'];
  const catLabel = (c) => c==='All' ? (lang==='ar'?'الكل':'All') : (lang==='ar' ? CATEGORY_AR[c] : c);
  const allSizes = useMemo(() => ['All', ...new Set(products.flatMap(p => p.sizes))], [products]);
  const allColors = useMemo(() => ['All', ...new Set(products.flatMap(p => p.colors))], [products]);
  const colorLabel = (c) => { if (c==='All') return lang==='ar'?'الكل':'All'; const p = PALETTES.find(pp=>pp.name===c); return lang==='ar' && p ? p.nameAr : c; };

  const filtered = useMemo(() => {
    let list = products.filter(p => (category === 'All' || p.category === category) && (size === 'All' || p.sizes.includes(size)) && (color === 'All' || p.colors.includes(color)) && p.price <= maxPrice);
    if (sort === 'price-asc') list = [...list].sort((a,b) => a.price - b.price);
    if (sort === 'price-desc') list = [...list].sort((a,b) => b.price - a.price);
    if (sort === 'newest') list = [...list].reverse();
    return list;
  }, [products, category, size, color, maxPrice, sort]);

  const FilterSelect = ({ label, value, setValue, options, labelFn }) => (
    <div className="mb-6">
      <p className="text-[10px] tracking-widest2 uppercase text-stone mb-2">{label}</p>
      <div className="flex flex-wrap gap-2">
        {options.map(opt => (
          <button key={opt} onClick={() => setValue(opt)} className={`text-[11px] px-3 py-1.5 border rounded-full transition ${value===opt ? 'bg-ink text-cream border-ink dark:bg-gold dark:text-ink dark:border-gold' : 'border-ink/20 dark:border-offwhite/20 text-ink/70 dark:text-offwhite/70 hover:border-gold'}`}>
            {labelFn ? labelFn(opt) : opt}
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <section id="shop" className="py-24 md:py-32 max-w-7xl mx-auto px-6 md:px-10">
      <Reveal>
        <Eyebrow>{t.trending_eyebrow}</Eyebrow>
        <h2 className="font-display text-4xl md:text-5xl mb-14 text-ink dark:text-offwhite">{t.trending_title}</h2>
      </Reveal>
      <div className="grid grid-cols-1 md:grid-cols-[240px_1fr] gap-12">
        <aside className="md:sticky md:top-32 h-fit">
          <FilterSelect label={t.filter_category} value={category} setValue={setCategory} options={categories} labelFn={catLabel} />
          <FilterSelect label={t.filter_size} value={size} setValue={setSize} options={allSizes} />
          <FilterSelect label={t.filter_color} value={color} setValue={setColor} options={allColors} labelFn={colorLabel} />
          <div className="mb-6">
            <p className="text-[10px] tracking-widest2 uppercase text-stone mb-2">{t.filter_price} — ${maxPrice}</p>
            <input type="range" min="200" max="2500" step="50" value={maxPrice} onChange={e => setMaxPrice(+e.target.value)} className="w-full" />
          </div>
          <div>
            <p className="text-[10px] tracking-widest2 uppercase text-stone mb-2">{t.filter_sort}</p>
            <select value={sort} onChange={e => setSort(e.target.value)} className="w-full bg-transparent border border-ink/20 dark:border-offwhite/20 text-[12px] px-3 py-2 rounded-sm text-ink dark:text-offwhite">
              <option value="newest" className="text-ink">{t.sort_newest}</option>
              <option value="price-desc" className="text-ink">{t.sort_desc}</option>
              <option value="price-asc" className="text-ink">{t.sort_asc}</option>
            </select>
          </div>
        </aside>
        <div>
          {filtered.length === 0 ? (
            <p className="text-stone text-sm">{t.no_match}</p>
          ) : (
            <div className="grid grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-12">
              {filtered.map(p => <ProductCard key={p.id} product={p} onOpen={onOpen} dark={dark} t={t} lang={lang} />)}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

/* ---------------------------------------------------------
   CART DRAWER
--------------------------------------------------------- */
function CartDrawer({ open, onClose, cart, setCart, onCheckout, t, lang }) {
  const [promo, setPromo] = useState('');
  const [appliedPromo, setAppliedPromo] = useState(null);
  const [promoMsg, setPromoMsg] = useState('');

  const subtotal = cart.reduce((s,i) => s + i.price*i.qty, 0);
  const discount = appliedPromo ? subtotal * appliedPromo.rate : 0;
  const total = subtotal - discount;

  const updateQty = (idx, delta) => { setCart(prev => prev.map((it,i) => i===idx ? {...it, qty: Math.max(1, it.qty+delta)} : it)); };
  const removeItem = (idx) => setCart(prev => prev.filter((_,i) => i!==idx));

  const applyPromo = () => {
    const code = promo.trim().toUpperCase();
    if (code === 'LUXE10') { setAppliedPromo({ code, rate: 0.10 }); setPromoMsg('10% applied — LUXE10'); }
    else if (code === 'LUXE20') { setAppliedPromo({ code, rate: 0.20 }); setPromoMsg('20% applied — LUXE20'); }
    else { setAppliedPromo(null); setPromoMsg(code ? 'Code not recognized' : ''); }
  };

  return (
    <>
      <div className={`fixed inset-0 z-40 bg-ink/50 transition-opacity duration-500 ${open ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`} onClick={onClose}></div>
      <div className={`drawer fixed top-0 ltr:right-0 rtl:left-0 z-50 h-full w-full max-w-md bg-offwhite dark:bg-charcoal text-ink dark:text-offwhite flex flex-col ${open ? 'translate-x-0' : 'ltr:translate-x-full rtl:-translate-x-full'}`}>
        <div className="flex items-center justify-between p-6 border-b border-ink/10 dark:border-offwhite/10">
          <p className="font-display text-2xl">{t.bag_title} ({cart.length})</p>
          <button onClick={onClose} className="text-xl">✕</button>
        </div>
        <div className="flex-1 overflow-y-auto p-6">
          {cart.length === 0 ? (
            <p className="text-stone text-sm mt-10 text-center">{t.bag_empty}</p>
          ) : cart.map((item,idx) => (
            <div key={idx} className="flex gap-4 mb-6">
              <div className="w-20 h-24 shrink-0 rounded-sm overflow-hidden border border-ink/10 dark:border-offwhite/10">
                <ProductVisual product={item} dark={false} className="w-full h-full" />
              </div>
              <div className="flex-1">
                <p className="font-display text-lg leading-tight">{lang==='ar'?item.nameAr:item.name}</p>
                <p className="text-[11px] text-stone mb-2">{item.color} / {item.size}</p>
                <div className="flex items-center justify-between">
                  <div className="flex items-center border border-ink/20 dark:border-offwhite/20 rounded-sm">
                    <button onClick={() => updateQty(idx,-1)} className="w-7 h-7 text-sm">−</button>
                    <span className="w-7 text-center text-xs">{item.qty}</span>
                    <button onClick={() => updateQty(idx,1)} className="w-7 h-7 text-sm">+</button>
                  </div>
                  <p className="text-gold text-sm font-medium">${(item.price*item.qty).toLocaleString()}</p>
                </div>
                <button onClick={() => removeItem(idx)} className="text-[10px] tracking-widest2 uppercase text-stone hover:text-gold mt-2">{t.admin_delete}</button>
              </div>
            </div>
          ))}
        </div>
        {cart.length > 0 && (
          <div className="p-6 border-t border-ink/10 dark:border-offwhite/10">
            <div className="flex gap-2 mb-3">
              <input value={promo} onChange={e=>setPromo(e.target.value)} placeholder={t.promo_placeholder}
                className="flex-1 border border-ink/20 dark:border-offwhite/20 rounded-sm px-3 py-2 text-sm bg-transparent" />
              <button onClick={applyPromo} className="ghost-btn px-4 text-[11px] uppercase rounded-sm">{t.apply}</button>
            </div>
            {promoMsg && <p className="text-[11px] text-gold mb-3">{promoMsg}</p>}
            <div className="flex justify-between text-sm mb-1"><span>{t.subtotal}</span><span>${subtotal.toLocaleString()}</span></div>
            {appliedPromo && <div className="flex justify-between text-sm mb-1 text-gold"><span>{t.discount}</span><span>-${discount.toFixed(0)}</span></div>}
            <div className="flex justify-between font-display text-xl mb-5"><span>{t.total}</span><span>${total.toFixed(0)}</span></div>
            <button onClick={() => onCheckout({ items: cart, subtotal, discount, total, promo: appliedPromo?.code||null })}
              className="gold-btn w-full py-4 text-[11px] uppercase">{t.checkout_btn}</button>
          </div>
        )}
      </div>
    </>
  );
}

  const back = () => setStep(s => Math.max(1, s-1));

    onComplete({ ...data, customer: form, placedAt: Date.now() });

              <input placeholder={t.email} value={form.email} onChange={set('email')} className="col-span-2 bg-transparent border border-ink/20 dark:border-offwhite/20 rounded-sm px-3 py-2.5 text-sm" />

              <input placeholder={t.country} value={form.country} onChange={set('country')} className="bg-transparent border border-ink/20 dark:border-offwhite/20 rounded-sm px-3 py-2.5 text-sm" />

              <button onClick={next} className="gold-btn flex-1 py-4 text-[11px] uppercase">{t.review_order}</button>

/* ---------------------------------------------------------
   CHAT WIDGET
--------------------------------------------------------- */
function ChatWidget({ conversations, setConversations, emit, webhookUrl, t }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState('');
  const [nameSet, setNameSet] = useState(false);
  const [text, setText] = useState('');
  const [convId, setConvId] = useState(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    let cid = loadLS(LS_KEYS.customerId, null);
    if (!cid) { cid = 'c-' + Math.random().toString(36).slice(2,9); saveLS(LS_KEYS.customerId, cid); }
    setConvId(cid);
    const existing = conversations.find(c => c.id === cid);
    if (existing) setNameSet(true);
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [open, conversations]);

  const conv = conversations.find(c => c.id === convId);

  const startChat = () => {
    if (!name.trim()) return;
    setConversations(prev => {
      if (prev.find(c => c.id === convId)) return prev;
      return [...prev, { id: convId, customerName: name.trim(), unread: 0, messages: [] }];
    });
    setNameSet(true);
  };

  const send = () => {
    if (!text.trim()) return;
    const msg = { from:'customer', text: text.trim(), ts: Date.now() };
    setConversations(prev => {
      const existing = prev.find(c => c.id === convId);
      const next = existing 
        ? prev.map(c => c.id===convId ? {...c, messages:[...c.messages, msg]} : c)
        : [...prev, { id: convId, customerName: name || 'Guest', unread: 0, messages: [msg] }];
      saveLS(LS_KEYS.conversations, next);
      return next;
    });
    emit('message.created', { conversationId: convId, customerName: name || 'Guest', text: msg.text }, webhookUrl);
    setText('');
    setTimeout(() => { if (window.cloudSyncTrigger) window.cloudSyncTrigger(); }, 50);
  };

  return (
    <>
      <button onClick={() => setOpen(o=>!o)} className="fixed bottom-6 ltr:right-6 rtl:left-6 z-40 w-16 h-16 rounded-full gold-btn shadow-2xl flex items-center justify-center text-xl">
        {open ? '✕' : '✦'}
      </button>
      {open && (
        <div className="fade-scale fixed bottom-28 ltr:right-6 rtl:left-6 z-40 w-[340px] max-w-[90vw] bg-offwhite dark:bg-charcoal text-ink dark:text-offwhite rounded-sm shadow-2xl border border-gold/20 flex flex-col h-[440px]">
          <div className="bg-ink text-offwhite px-5 py-4 flex items-center gap-3">
            <span className="w-2 h-2 rounded-full bg-gold"></span>
            <div>
              <p className="font-display text-lg leading-none">{t.chat_brand}</p>
              <p className="text-[10px] text-offwhite/50 tracking-widest2 uppercase mt-1">{t.chat_care}</p>
            </div>
          </div>
          {!nameSet ? (
            <div className="flex-1 flex flex-col justify-center p-6">
              <p className="text-sm opacity-80 mb-4">{t.chat_intro}</p>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder={t.chat_name_ph} className="bg-transparent border border-ink/20 dark:border-offwhite/20 rounded-sm px-3 py-2.5 text-sm mb-3" />
              <button onClick={startChat} className="gold-btn py-3 text-[11px] uppercase">{t.chat_start}</button>
            </div>
          ) : (
            <>
              <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-3">
                {(conv?.messages || []).length === 0 && (
                  <p className="text-xs text-stone text-center mt-10">{t.chat_empty}</p>
                )}
                {(conv?.messages || []).map((m,i) => (
                  <div key={i} className={`flex ${m.from==='customer' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[75%] px-3 py-2 rounded-sm text-[13px] ${m.from==='customer' ? 'bg-ink text-offwhite dark:bg-gold dark:text-ink' : 'bg-parchment text-ink dark:bg-char2 dark:text-offwhite'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>
              <div className="p-3 border-t border-ink/10 dark:border-offwhite/10 flex gap-2">
                <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e => e.key==='Enter' && send()} placeholder={t.chat_type_ph} className="flex-1 bg-transparent border border-ink/20 dark:border-offwhite/20 rounded-sm px-3 py-2 text-sm" />
                <button onClick={send} className="gold-btn px-4 rounded-sm text-sm">→</button>
              </div>
            </>
          )}
        </div>
      )}
    </>
  );
}

/* ===========================================================
   STOREFRONT ROOT
=========================================================== */
function Storefront({ products, theme, collections, cart, setCart, orders, setOrders, conversations, setConversations, emit, onGoAdmin, t, lang, setLang, dark, setDark }) {
  const [activeProduct, setActiveProduct] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [checkoutData, setCheckoutData] = useState(null);
  const [contentModalItem, setContentModalItem] = useState(null);

  const addToCart = (item) => setCart(prev => [...prev, item]);
  const cartCount = cart.reduce((s,i) => s+i.qty, 0);

  const handleNav = (key) => {
    if (key === 'home') window.scrollTo({top:0, behavior:'smooth'});
    else if (key === 'story') document.getElementById('story')?.scrollIntoView({behavior:'smooth'});
    else document.getElementById('shop')?.scrollIntoView({behavior:'smooth'});
  };

  const handleCheckout = (data) => { setCartOpen(false); setCheckoutData(data); };
  const completeOrder = (order) => {
    const id = 'ORD-' + Math.floor(1000 + Math.random()*9000);
    const fullOrder = { id, ...order, status: 'Pending' };
    setOrders(prev => [fullOrder, ...prev]);
    emit('order.created', { orderId: id, total: order.total, items: order.items.length, customer: order.customer.name }, theme.webhookUrl);
    setCart([]);
  };

  return (
    <div>
      <Nav cartCount={cartCount} onCartOpen={()=>setCartOpen(true)} onGoAdmin={onGoAdmin} onNavClick={handleNav} announcement={theme.announcement} t={t} lang={lang} setLang={setLang} dark={dark} setDark={setDark} />
      <Hero theme={theme} onExplore={() => handleNav('shop')} t={t} dark={dark} />
      <CollectionsSlider collections={collections} t={t} lang={lang} />
      <PromoStrip text={theme.promoBanner} />
      <Catalog products={products} onOpen={setActiveProduct} dark={dark} t={t} lang={lang} />
      <div id="story"><BrandStory theme={theme} t={t} lang={lang} /></div>
      <Footer onGoAdmin={onGoAdmin} onOpenContent={setContentModalItem} onNavClick={handleNav} t={t} />

      <ProductModal product={activeProduct} onClose={()=>setActiveProduct(null)} onAddToCart={addToCart} dark={dark} t={t} lang={lang} />
      <ContentModal itemKey={contentModalItem} onClose={()=>setContentModalItem(null)} theme={theme} lang={lang} t={t} />
      <CartDrawer open={cartOpen} onClose={()=>setCartOpen(false)} cart={cart} setCart={setCart} onCheckout={handleCheckout} t={t} lang={lang} />
      <CheckoutModal data={checkoutData} onClose={()=>setCheckoutData(null)} onComplete={completeOrder} t={t} />
      <ChatWidget conversations={conversations} setConversations={setConversations} emit={emit} webhookUrl={theme.webhookUrl} t={t} />
    </div>
  );
}

  const save = () => {
    const item = {

function AdminChat({ conversations, setConversations, emit, webhookUrl, t }) {
  const [active, setActive] = useState(conversations[0]?.id || null);
  const [reply, setReply] = useState('');
  const activeConv = conversations.find(c => c.id === active);

  const send = () => {
    if (!reply.trim() || !active) return;
    const msg = { from:'admin', text: reply.trim(), ts: Date.now() };
    setConversations(prev => {
      const next = prev.map(c => c.id===active ? {...c, messages:[...c.messages, msg]} : c);
      saveLS(LS_KEYS.conversations, next);
      return next;
    });
    emit('message.created', { conversationId: active, from:'admin', text: msg.text }, webhookUrl);
    setReply('');
    setTimeout(() => { if (window.cloudSyncTrigger) window.cloudSyncTrigger(); }, 50);
  };

  return (
    <div className="space-y-6 text-offwhite">
      <h2 className="font-display text-3xl">{t.admin_chat}</h2>
      <div className="grid grid-cols-1 md:grid-cols-3 bg-charcoal border border-gold/20 rounded-sm h-[480px]">
        <div className="border-r border-gold/10 overflow-y-auto p-3 space-y-2">
          {conversations.length===0 ? <p className="text-stone text-xs">{t.chatcenter_none}</p> : conversations.map(c => (
            <button key={c.id} onClick={() => setActive(c.id)} className={`w-full p-3 text-left ltr:text-left rtl:text-right rounded-sm border ${c.id===active ? 'bg-ink border-gold' : 'border-gold/10'}`}>
              <p className="font-medium text-xs text-offwhite">{c.customerName}</p>
              <p className="text-[10px] text-stone truncate">{c.messages[c.messages.length-1]?.text}</p>
            </button>
          ))}
        </div>
        <div className="md:col-span-2 flex flex-col h-full bg-ink p-4">
          {activeConv ? (
            <>
              <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                {activeConv.messages.map((m,i) => (
                  <div key={i} className={`flex ${m.from==='admin' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[75%] px-3 py-2 rounded-sm text-xs ${m.from==='admin' ? 'bg-gold text-ink' : 'bg-charcoal text-offwhite border border-gold/20'}`}>{m.text}</div>
                  </div>
                ))}
              </div>
              <div className="flex gap-2 pt-3 border-t border-gold/10">
                <input value={reply} onChange={e=>setReply(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder={t.chatcenter_reply_ph} className="flex-1 bg-charcoal border border-gold/20 p-2 text-xs text-offwhite" />
                <button onClick={send} className="gold-btn px-4 text-xs uppercase">{t.chatcenter_send}</button>
              </div>
            </>
          ) : <div className="flex-1 flex items-center justify-center text-stone text-xs">{t.chatcenter_select}</div>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState(() => loadLS(LS_KEYS.view, 'storefront'));
  const [lang, setLang] = useState(() => loadLS(LS_KEYS.lang, 'en'));
  const [dark, setDark] = useState(() => loadLS(LS_KEYS.dark, false));

  const [products, setProducts] = useState(() => {
    const loaded = loadLS(LS_KEYS.products, null);
    if (!loaded || !Array.isArray(loaded) || loaded.length === 0) {
      return SEED_PRODUCTS;
    }
    // Retain ALL user custom uploaded image data, price, titles, and custom products
    return loaded.map(p => {
      const seed = SEED_PRODUCTS.find(sp => sp.id === p.id);
      return { ...seed, ...p, img: p.img || seed?.img || '' };
    });
  });

  const [collections, setCollections] = useState(() => {
    const loaded = loadLS(LS_KEYS.collections, null);
    if (!loaded || !Array.isArray(loaded) || loaded.length === 0) {
      return SEED_COLLECTIONS;
    }
    return loaded.map((c, i) => {
      const seed = SEED_COLLECTIONS[i] || SEED_COLLECTIONS[0];
      return { ...seed, ...c, img: c.img || seed?.img || '' };
    });
  });
  const [orders, setOrders] = useState(() => loadLS(LS_KEYS.orders, []));
  const [conversations, setConversations] = useState(() => loadLS(LS_KEYS.conversations, SEED_CONVERSATIONS));
  const [theme, setTheme] = useState(() => {
    const loaded = loadLS(LS_KEYS.theme, null);
    return loaded ? { ...SEED_THEME, ...loaded } : SEED_THEME;
  });
  const [cart, setCart] = useState(() => loadLS(LS_KEYS.cart, []));

  const { log, emit } = useWebhookLog();
  const t = I18N[lang] || I18N.en;

  const isRemoteUpdateRef = useRef(false);

  // Real-Time Cloud Database & Supabase Sync Handler (Orders, Chat, Products, Collections, Theme)
  const syncToCloud = useCallback((payload) => {
    try {
      const fullPayload = { ...payload, ts: Date.now() };
      if (theme?.supabaseUrl && theme?.supabaseKey && window.supabase) {
        const sb = window.supabase.createClient(theme.supabaseUrl, theme.supabaseKey);
        sb.from('store_state').upsert({ id: 'main_store', payload: fullPayload, updated_at: new Date() }).then(() => {}).catch(() => {});
      }
      
      const url = theme?.cloudSyncUrl || 'https://api.myjson.online/v1/records/maison_noir_db';
      fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullPayload)
      }).catch(() => {});
    } catch(e) {}
  }, [theme?.supabaseUrl, theme?.supabaseKey, theme?.cloudSyncUrl]);

  // Function to pull and merge latest Orders, Chat Messages, Products, Collections, and Theme from Cloud / Supabase
  const pullCloudData = useCallback(() => {
    try {
      const applyData = (data) => {
        if (!data || typeof data !== 'object') return;
        isRemoteUpdateRef.current = true;

        if (Array.isArray(data.products) && data.products.length > 0) {
          setProducts(prev => {
            const next = data.products.map(p => {
              const local = (prev || []).find(lp => lp.id === p.id);
              return { ...p, img: p.img || local?.img || '' };
            });
            saveLS(LS_KEYS.products, next);
            return next;
          });
        }
        if (Array.isArray(data.collections) && data.collections.length > 0) {
          setCollections(data.collections);
          saveLS(LS_KEYS.collections, data.collections);
        }
        if (Array.isArray(data.orders)) {
          setOrders(prev => {
            const map = new Map();
            (prev || []).forEach(o => map.set(o.id, o));
            (data.orders || []).forEach(o => map.set(o.id, o));
            const merged = Array.from(map.values());
            saveLS(LS_KEYS.orders, merged);
            return merged;
          });
        }
        if (Array.isArray(data.conversations) && data.conversations.length > 0) {
          setConversations(prev => {
            const map = new Map();
            (prev || []).forEach(c => map.set(c.id, c));
            (data.conversations || []).forEach(c => {
              const existing = map.get(c.id);
              if (!existing) {
                map.set(c.id, c);
              } else {
                const msgMap = new Map();
                (existing.messages || []).forEach(m => msgMap.set(`${m.from}_${m.ts}`, m));
                (c.messages || []).forEach(m => msgMap.set(`${m.from}_${m.ts}`, m));
                const sortedMsgs = Array.from(msgMap.values()).sort((a,b) => a.ts - b.ts);
                map.set(c.id, { ...existing, ...c, messages: sortedMsgs });
              }
            });
            const merged = Array.from(map.values());
            saveLS(LS_KEYS.conversations, merged);
            return merged;
          });
        }
        if (data.theme) {
          setTheme(prev => {
            const next = { ...prev, ...data.theme };
            saveLS(LS_KEYS.theme, next);
            return next;
          });
        }

        setTimeout(() => { isRemoteUpdateRef.current = false; }, 300);
      };

      if (theme?.supabaseUrl && theme?.supabaseKey && window.supabase) {
        const sb = window.supabase.createClient(theme.supabaseUrl, theme.supabaseKey);
        sb.from('store_state').select('*').eq('id', 'main_store').single().then(res => {
          if (res && res.data && res.data.payload) {
            applyData(res.data.payload);
          }
        }).catch(() => {});
      }
    } catch(e) {}
  }, [theme?.supabaseUrl, theme?.supabaseKey]);

  // Pull latest data on mount & subscribe to Supabase Realtime changes
  useEffect(() => {
    if (theme?.supabaseUrl && theme?.supabaseKey) {
      pullCloudData();
    }

    let channel = null;
    if (theme?.supabaseUrl && theme?.supabaseKey && window.supabase) {
      try {
        const sb = window.supabase.createClient(theme.supabaseUrl, theme.supabaseKey);
        channel = sb.channel('public:store_state')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'store_state' }, () => {
            pullCloudData();
          })
          .subscribe();
      } catch(e) {}
    }

    return () => {
      if (channel && window.supabase) {
        try { channel.unsubscribe(); } catch(e) {}
      }
    };
  }, [pullCloudData, theme?.supabaseUrl, theme?.supabaseKey]);

  window.cloudSyncTrigger = () => {
    syncToCloud({ products, collections, theme, orders, conversations });
  };

  useEffect(() => saveLS(LS_KEYS.view, view), [view]);

  useEffect(() => {
    saveLS(LS_KEYS.lang, lang);
    document.documentElement.dir = t.dir;
    document.documentElement.lang = lang;
  }, [lang, t]);

  useEffect(() => {
    saveLS(LS_KEYS.dark, dark);
    if (dark) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [dark]);

  useEffect(() => {
    saveLS(LS_KEYS.products, products);
    if (!isRemoteUpdateRef.current) syncToCloud({ products, collections, theme, orders, conversations });
  }, [products]);

  useEffect(() => {
    saveLS(LS_KEYS.collections, collections);
    if (!isRemoteUpdateRef.current) syncToCloud({ products, collections, theme, orders, conversations });
  }, [collections]);

  useEffect(() => {
    saveLS(LS_KEYS.orders, orders);
    if (!isRemoteUpdateRef.current) syncToCloud({ products, collections, theme, orders, conversations });
  }, [orders]);

  useEffect(() => {
    saveLS(LS_KEYS.conversations, conversations);
    if (!isRemoteUpdateRef.current) syncToCloud({ products, collections, theme, orders, conversations });
  }, [conversations]);

  useEffect(() => {
    saveLS(LS_KEYS.theme, theme);
    if (!isRemoteUpdateRef.current) syncToCloud({ products, collections, theme, orders, conversations });
  }, [theme]);

  useEffect(() => saveLS(LS_KEYS.cart, cart), [cart]);

  return (
    <div>
      {view === 'storefront' && (
        <Storefront products={products} theme={theme} collections={collections} cart={cart} setCart={setCart} orders={orders} setOrders={setOrders} conversations={conversations} setConversations={setConversations} emit={emit} onGoAdmin={() => setView('adminLogin')} t={t} lang={lang} setLang={setLang} dark={dark} setDark={setDark} />
      )}
      {view === 'adminLogin' && (
        <AdminLogin onSuccess={() => setView('adminDashboard')} onBack={() => setView('storefront')} t={t} />
      )}
      {view === 'adminDashboard' && (
        <AdminDashboard products={products} setProducts={setProducts} collections={collections} setCollections={setCollections} orders={orders} setOrders={setOrders} theme={theme} setTheme={setTheme} conversations={conversations} setConversations={setConversations} log={log} emit={emit} onExit={() => setView('storefront')} t={t} lang={lang} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
